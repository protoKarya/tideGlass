# =============================================================================
# tideGlass Cell Deploy Graph — Drug Repurposing Protist on westGate
# =============================================================================
#
# Attaches the tideGlass garden to a running NUCLEUS composition on westGate.
# Cell attachment graph — expects biomeOS NUCLEUS already running with 14/14.
#
# The graph:
#   Phase 1: Verify NUCLEUS health (core primals)
#   Phase 2: Start tideGlass protist (7 science modules)
#   Phase 3: Wire capabilities (tideGlass → nestGate CAS, petalTongue viz)
#   Phase 4: Validate composition health
#
# Prerequisites:
#   - biomeOS NUCLEUS running on westGate (14/14 HEALTHY)
#   - 452 GB CAS pool with GPS data (11 JSON, 103 MB)
#   - tideGlass binary available in plasmidBin
#
# Usage:
#   biomeos nucleus attach runtime_graphs/tideglass_cell.toml
#   biomeos nucleus attach runtime_graphs/tideglass_cell.toml --dry-run
# =============================================================================

[graph]
id = "tideglass_cell"
description = "Attach tideGlass drug repurposing protist to NUCLEUS on westGate"
version = "2.0.0"
coordination = "Sequential"

[graph.metadata]
particle = "proton"
security_model = "btsp_enforced"
transport = "platform_native"
gate = "westGate"
fragments = ["science", "cell_attachment", "drug_repurposing"]

# =============================================================================
# Phase 1: Verify NUCLEUS is running and healthy
# =============================================================================

[[nodes]]
id = "verify_nucleus"
action = "check_primal"

[nodes.params]
primal_name = "biomeos"

[nodes.constraints]
timeout_ms = 5000

[[nodes]]
id = "verify_nestgate"
action = "check_primal"
depends_on = ["verify_nucleus"]

[nodes.params]
primal_name = "nestgate"

[nodes.constraints]
timeout_ms = 5000

[[nodes]]
id = "verify_barracuda"
action = "check_primal"
depends_on = ["verify_nucleus"]

[nodes.params]
primal_name = "barracuda"

[nodes.constraints]
timeout_ms = 5000

[[nodes]]
id = "verify_petaltongue"
action = "check_primal"
depends_on = ["verify_nucleus"]
fallback = "skip"

[nodes.params]
primal_name = "petaltongue"

[nodes.constraints]
timeout_ms = 5000

[[nodes]]
id = "verify_squirrel"
action = "check_primal"
depends_on = ["verify_nucleus"]

[nodes.params]
primal_name = "squirrel"

[nodes.constraints]
timeout_ms = 5000

# =============================================================================
# Phase 2: Start tideGlass protist
# =============================================================================

[[nodes]]
id = "start_tideglass"
action = "start_primal"
depends_on = ["verify_nestgate", "verify_barracuda", "verify_petaltongue", "verify_squirrel"]

[nodes.primal]
by_capability = "science"

[nodes.params]
primal_name = "tideglass"
family_id = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 120000

# =============================================================================
# Phase 3: Wire capabilities (tideGlass → nestGate CAS + petalTongue viz)
# =============================================================================

[[nodes]]
id = "wire_tideglass_science"
action = "wire_data"
depends_on = ["start_tideglass"]

[nodes.params]
primal_name = "tideglass"
capabilities = [
    "science.rges_screen",
    "science.rcl_select",
    "science.gps4drug_predict",
    "science.compound_screen",
    "science.mcts_optimize",
    "science.octad_benchmark",
    "science.nf_score",
]

[nodes.constraints]
timeout_ms = 10000

[[nodes]]
id = "wire_tideglass_viz"
action = "wire_data"
depends_on = ["start_tideglass"]

[nodes.params]
primal_name = "tideglass"
capabilities = [
    "visualization.rges_volcano",
    "visualization.enrichment_curve",
    "visualization.nf_dashboard",
    "visualization.gps4drug_scatter",
    "visualization.mcts_trace",
]

[nodes.constraints]
timeout_ms = 10000

[[nodes]]
id = "wire_tideglass_data"
action = "wire_data"
depends_on = ["start_tideglass"]

[nodes.params]
primal_name = "tideglass"
capabilities = ["data.catalog"]

[nodes.constraints]
timeout_ms = 10000

# =============================================================================
# Phase 4: Validate composition health
# =============================================================================

[[nodes]]
id = "health_check"
action = "check_primal"
depends_on = ["wire_tideglass_science", "wire_tideglass_viz", "wire_tideglass_data"]

[nodes.params]
primal_name = "tideglass"

[nodes.constraints]
timeout_ms = 10000

[[nodes]]
id = "report"
action = "log"
depends_on = ["health_check"]

[nodes.params]
message = "tideGlass cell attached to NUCLEUS on westGate — drug repurposing protist LIVE"
level = "info"
