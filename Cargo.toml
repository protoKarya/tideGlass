[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
repository = "https://git.primals.eco/protoKarya/tideGlass"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal"] }
tideglass-core = { path = "crates/tideglass-core" }
tideglass-rges = { path = "crates/tideglass-rges" }
tideglass-rcl = { path = "crates/tideglass-rcl" }
tideglass-gps4drug = { path = "crates/tideglass-gps4drug" }
tideglass-screen = { path = "crates/tideglass-screen" }
tideglass-molsearch = { path = "crates/tideglass-molsearch" }
tideglass-octad = { path = "crates/tideglass-octad" }
tideglass-nf = { path = "crates/tideglass-nf" }
