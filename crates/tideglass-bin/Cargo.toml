[package]
name = "tideglass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tideGlass UniBin — sovereign drug repurposing service for biomeOS deployment"

[[bin]]
name = "tideglass"
path = "src/main.rs"

[dependencies]
tideglass-core = { workspace = true }
tideglass-rges = { workspace = true }
tideglass-rcl = { workspace = true }
tideglass-gps4drug = { workspace = true }
tideglass-screen = { workspace = true }
tideglass-molsearch = { workspace = true }
tideglass-octad = { workspace = true }
tideglass-nf = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
